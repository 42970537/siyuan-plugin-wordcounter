<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b9cf5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e8ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="160" height="160" rx="32" ry="32" fill="url(#bg)"/>
  <!-- 笔 -->
  <g transform="translate(35, 30) rotate(-45, 45, 50)">
    <rect x="38" y="10" width="14" height="70" rx="3" fill="url(#pen)" opacity="0.95"/>
    <polygon points="42,80 48,80 45,95" fill="#fff" opacity="0.9"/>
    <!-- 笔尖高光 -->
    <line x1="40" y1="20" x2="50" y2="20" stroke="#4285f4" stroke-width="1.5" opacity="0.3"/>
  </g>
  <!-- 速度线 -->
  <g opacity="0.6">
    <line x1="100" y1="60" x2="125" y2="55" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="105" y1="75" x2="130" y2="73" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="98" y1="90" x2="118" y2="92" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- 计数气泡 -->
  <circle cx="120" cy="42" r="18" fill="#fff" opacity="0.95"/>
  <text x="120" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#4285f4" font-family="Arial, sans-serif">N</text>
</svg>